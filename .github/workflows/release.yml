name: Release Charon (macOS Universal)

on:
  push:
    tags:
      - "v*"

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-macos:
    name: 🔨 Build macOS App (x86_64 and arm64)
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 🔧 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 🔨 Build App for ${{ matrix.arch }}
        run: |
          export UNAME=${{ matrix.arch }}
          make clean
          make build
          cd build/bin
          zip -r charon-${{ matrix.arch }}.zip charon.app

      - name: 📤 Upload Built App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: charon-macos-${{ matrix.arch }}
          path: build/bin/charon-${{ matrix.arch }}.zip

  release:
    name: 🚀 Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📦 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            artifacts/charon-macos-x86_64/charon-x86_64.zip
            artifacts/charon-macos-arm64/charon-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
