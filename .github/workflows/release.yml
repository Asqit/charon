name: Release Charon (macOS Universal)

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: 🔨 Build macOS Universal App
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: 🏗️ Build Wails App
        uses: dAppServer/wails-build-action@v2.2
        id: build
        with:
          build-name: Charon
          build-platform: darwin/universal
          go-version: "1.22"
          package: true # generates the zip for you

      - name: 📤 Upload Built Artifact
        uses: actions/upload-artifact@v4
        with:
          name: charon-macos-universal
          path: ./build/bin/Charon*.zip # adjust if needed

  release:
    name: 🚀 Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: artifacts/charon-macos-universal/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
